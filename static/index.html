<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vé Sự Kiện - SecurePass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/linear-theme.css">
  <script src="/static/qrcode.min.js"></script>
  <style>
    .pass-layout {
      max-width: 440px;
      margin: 0 auto;
    }

    .ticket-card {
      background: var(--surface-1);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .ticket-head {
      padding: 24px;
      border-bottom: 1px dashed var(--hairline-strong);
      background: var(--surface-2);
      position: relative;
    }

    .ticket-head::before, .ticket-head::after {
      content: '';
      position: absolute;
      bottom: -10px;
      width: 20px;
      height: 20px;
      background: var(--canvas);
      border-radius: 50%;
    }
    .ticket-head::before { left: -10px; }
    .ticket-head::after { right: -10px; }

    .ticket-tier {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--primary-subtle);
      color: var(--primary);
      border: 1px solid rgba(94, 106, 210, 0.25);
      display: inline-block;
      margin-bottom: 10px;
    }

    .ticket-event {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .ticket-time {
      font-size: 13px;
      color: var(--ink-subtle);
    }

    .ticket-body {
      padding: 32px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface-1);
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      margin-bottom: 24px;
      min-width: 208px;
      min-height: 208px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img, #qrcode canvas {
      display: block;
      margin: 0 auto;
    }

    .countdown-widget {
      width: 100%;
      margin-bottom: 24px;
    }

    .countdown-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--ink-subtle);
      margin-bottom: 6px;
    }

    .countdown-track {
      height: 4px;
      background: var(--surface-3);
      border-radius: 2px;
      overflow: hidden;
    }

    .countdown-fill {
      height: 100%;
      background: var(--primary);
      width: 100%;
      transition: width 1s linear, background-color 0.2s ease;
    }

    .ticket-meta-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 18px 24px;
      border-top: 1px solid var(--hairline);
      background: var(--surface-2);
    }

    .meta-box label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--ink-subtle);
      margin-bottom: 4px;
    }

    .meta-box strong {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-section">
      <div class="brand-logo">Q</div>
      <a href="/" class="brand-name">
        <span>SecurePass</span>
        <span class="badge-tag" id="tagPortal">Cổng Vé Người Tham Dự</span>
      </a>
    </div>

    <!-- 3-Level Role Selector -->
    <nav class="role-selector-bar" id="roleSelectorBar">
      <a href="/" class="role-tab active" id="tabGuest" title="Cấp 1: Người tham dự sự kiện">
        <span class="role-num">1</span>
        <span class="role-icon">🎟️</span>
        <span class="role-label">Khách</span>
      </a>
      <a href="/gatekeeper" class="role-tab" id="tabGuard" title="Cấp 2: Nhân viên an ninh cổng soát vé">
        <span class="role-num">2</span>
        <span class="role-icon">🛡️</span>
        <span class="role-label">Bảo Vệ</span>
      </a>
      <a href="/admin" class="role-tab" id="tabAdmin" title="Cấp 3: Quản trị viên & Phòng thí nghiệm">
        <span class="role-num">3</span>
        <span class="role-icon">🔬</span>
        <span class="role-label">Quản Trị / Lab</span>
      </a>
    </nav>

    <div class="utility-controls">
      <button class="lang-btn" onclick="toggleLanguage()" title="Chuyển ngôn ngữ / Switch Language">
        <span id="langIndicator">EN</span>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" title="Đổi giao diện Sáng/Tối">
        <span id="themeIcon">☀️</span>
      </button>
      <button class="btn btn-secondary" onclick="logout()" style="height: 32px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;" id="btnLogout" title="Đăng xuất">
        <span>🚪</span> <span>Đăng Xuất</span>
      </button>
    </div>
  </header>

  <main>
    <div class="pass-layout">
      
      <!-- Ticket Pass Card -->
      <div class="ticket-card">
        <div class="ticket-head">
          <span class="ticket-tier">VIP PASS</span>
          <h1 class="ticket-event">ATBMTT Cyber Security Summit 2026</h1>
          <div class="ticket-time" id="txtVenue">Trung tâm Hội nghị Quốc gia • Hà Nội</div>
        </div>

        <div class="ticket-body">
          <div class="qr-frame">
            <div id="qrcode"></div>
            <canvas id="qrCanvas" width="180" height="180" style="display: none;"></canvas>
          </div>

          <div class="countdown-widget">
            <div class="countdown-meta">
              <span id="lblRotating">MÃ QR TỰ LÀM MỚI SAU</span>
              <span id="countdownTimer">30s</span>
            </div>
            <div class="countdown-track">
              <div id="countdownBar" class="countdown-fill"></div>
            </div>
          </div>

          <div style="display: flex; gap: 6px; width: 100%; margin-top: 4px;">
            <button class="btn btn-secondary" onclick="downloadQRCode()" style="flex: 1; height: 32px; font-size: 11px; padding: 0 4px;" id="btnDownloadQR">
              📥 Tải ảnh mã QR
            </button>
            <button class="btn btn-secondary" onclick="forceRotateQR()" style="flex: 1; height: 32px; font-size: 11px; padding: 0 4px;" id="btnForceRotate">
              🔄 Làm mới mã QR
            </button>
            <button class="btn btn-secondary" onclick="resetTicketStatus()" style="flex: 1; height: 32px; font-size: 11px; padding: 0 4px; color: var(--primary);" id="btnResetTicket">
              ♻️ Đặt lại vé ACTIVE
            </button>
          </div>
        </div>

        <div class="ticket-meta-grid">
          <div class="meta-box">
            <label id="lblOwner">Chủ vé</label>
            <strong id="ticketOwner">Nguyễn Văn An</strong>
          </div>
          <div class="meta-box">
            <label id="lblStatus">Trạng thái</label>
            <strong id="ticketStatus" style="color: var(--success);">HỢP LỆ</strong>
          </div>
          <div class="meta-box">
            <label id="lblGate">Cổng check-in</label>
            <strong style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">GATE 1A</strong>
          </div>
          <div class="meta-box">
            <label id="lblTicketId">Mã định danh vé</label>
            <strong id="ticketIdDisplay" style="font-family: 'JetBrains Mono', monospace; font-size: 13px;">TK-98A4-2026</strong>
          </div>
        </div>
      </div>


    </div>
  </main>

  <footer>
    <div>© 2026 SecurePass • An Toàn & Bảo Mật Thông Tin</div>
  </footer>

  <script>
    let currentLang = 'vi';

    const i18n = {
      vi: {
        tagPortal: "Cổng Vé Người Tham Dự",
        venue: "Trung tâm Hội nghị Quốc gia • Hà Nội",
        rotating: "MÃ QR TỰ LÀM MỚI SAU",
        owner: "Chủ vé",
        status: "Trạng thái",
        gate: "Cổng check-in",
        ticketId: "Mã định danh vé",
        statusValid: "HỢP LỆ",
        statusUsed: "ĐÃ SỬ DỤNG",
        navGatekeeper: "🛡️ Cổng Soát Vé Bảo Vệ",
        navAdmin: "🔬 Phòng Thí Nghiệm & Quản Trị",
        btnDownloadQR: "📥 Tải ảnh mã QR",
        btnForceRotate: "🔄 Làm mới mã QR",
        btnResetTicket: "♻️ Đặt lại vé ACTIVE"
      },
      en: {
        tagPortal: "Attendee Ticket Portal",
        venue: "National Convention Center • Hanoi",
        rotating: "QR CODE REFRESHING IN",
        owner: "Attendee",
        status: "Status",
        gate: "Assigned Gate",
        ticketId: "Ticket ID",
        statusValid: "ACTIVE",
        statusUsed: "USED",
        navGatekeeper: "🛡️ Gatekeeper Terminal",
        navAdmin: "🔬 Security Lab",
        btnDownloadQR: "📥 Download QR Image",
        btnForceRotate: "🔄 Rotate QR Now",
        btnResetTicket: "♻️ Reset to ACTIVE"
      }
    };

    function applyI18n() {
      const t = i18n[currentLang];
      document.getElementById('tagPortal').textContent = t.tagPortal;
      document.getElementById('txtVenue').textContent = t.venue;
      document.getElementById('lblRotating').textContent = t.rotating;
      document.getElementById('lblOwner').textContent = t.owner;
      document.getElementById('lblStatus').textContent = t.status;
      document.getElementById('lblGate').textContent = t.gate;
      document.getElementById('lblTicketId').textContent = t.ticketId;
      document.getElementById('btnDownloadQR').textContent = t.btnDownloadQR;
      document.getElementById('btnForceRotate').textContent = t.btnForceRotate;
      document.getElementById('btnResetTicket').textContent = t.btnResetTicket;
      document.getElementById('langIndicator').textContent = currentLang === 'vi' ? 'EN' : 'VI';
    }

    function toggleLanguage() {
      currentLang = currentLang === 'vi' ? 'en' : 'vi';
      applyI18n();
    }

    function toggleTheme() {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    let countdown = 30;
    let timerHandle = null;
    const ticketId = "TK-98A4-2026";

    function drawLinearQR(seed) {
      const canvas = document.getElementById('qrCanvas');
      if (!canvas) return;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      const size = 180;
      const cells = 25;
      const cellSize = size / cells;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#090A0F';

      function drawCorner(x, y) {
        ctx.fillRect(x * cellSize, y * cellSize, 7 * cellSize, 7 * cellSize);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect((x + 1) * cellSize, (y + 1) * cellSize, 5 * cellSize, 5 * cellSize);
        ctx.fillStyle = '#090A0F';
        ctx.fillRect((x + 2) * cellSize, (y + 2) * cellSize, 3 * cellSize, 3 * cellSize);
      }

      drawCorner(0, 0);
      drawCorner(cells - 7, 0);
      drawCorner(0, cells - 7);

      // Seed hashing - strictly unsigned 32-bit positive
      let hash = 5381;
      for (let i = 0; i < seed.length; i++) {
        hash = (((hash << 5) + hash) + seed.charCodeAt(i)) >>> 0;
      }

      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          if ((r < 8 && c < 8) || (r < 8 && c > cells - 9) || (r > cells - 9 && c < 8)) continue;
          if (r === 6 || c === 6) {
            if ((r + c) % 2 === 0) ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
            continue;
          }
          hash = (Math.imul(hash, 1103515245) + 12345) >>> 0;
          if ((hash % 100) < 46) {
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          }
        }
      }
    }

    let qrCodeObj = null;
    function renderQRCode(payloadStr) {
      const qrContainer = document.getElementById('qrcode');
      if (typeof QRCode !== 'undefined' && qrContainer) {
        try {
          if (!qrCodeObj) {
            qrContainer.innerHTML = '';
            qrCodeObj = new QRCode(qrContainer, {
              text: payloadStr,
              width: 180,
              height: 180,
              colorDark: "#090A0F",
              colorLight: "#FFFFFF",
              correctLevel: QRCode.CorrectLevel.L
            });
          } else {
            qrCodeObj.makeCode(payloadStr);
          }
          return;
        } catch (e) {
          console.warn("Lỗi QRCode library, chuyển sang vẽ canvas:", e);
        }
      }
      if (qrContainer) qrContainer.style.display = 'none';
      drawLinearQR(payloadStr);
    }

    async function fetchLiveQR() {
      try {
        const res = await fetch(`/api/tickets/${ticketId}/qr`);
        if (res.ok) {
          const data = await res.json();
          const payload = data.qr_payload;
          
          // Draw real cryptographic payload into QR code
          renderQRCode(JSON.stringify(payload));

          // Save payload for gatekeeper testing
          localStorage.setItem('server_live_payload', JSON.stringify(payload));

          // Update status
          const t = i18n[currentLang];
          const stEl = document.getElementById('ticketStatus');
          if (data.status === 'ACTIVE') {
            stEl.textContent = t.statusValid;
            stEl.style.color = 'var(--success)';
          } else {
            stEl.textContent = t.statusUsed;
            stEl.style.color = 'var(--danger)';
          }
        }
      } catch (err) {
        console.error("Không thể kết nối máy chủ API:", err);
      }
    }

    function startCountdown() {
      if (timerHandle) clearInterval(timerHandle);
      countdown = 30;
      fetchLiveQR();

      timerHandle = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          countdown = 30;
          fetchLiveQR();
        }
        document.getElementById('countdownTimer').textContent = countdown + 's';
        const pct = (countdown / 30) * 100;
        const bar = document.getElementById('countdownBar');
        bar.style.width = pct + '%';
        if (countdown <= 5) {
          bar.style.backgroundColor = 'var(--danger)';
        } else if (countdown <= 12) {
          bar.style.backgroundColor = 'var(--warning)';
        } else {
          bar.style.backgroundColor = 'var(--primary)';
        }
      }, 1000);
    }

    function forceRotateQR() {
      countdown = 30;
      const bar = document.getElementById('countdownBar');
      bar.style.width = '100%';
      bar.style.backgroundColor = 'var(--primary)';
      document.getElementById('countdownTimer').textContent = '30s';
      fetchLiveQR();
    }

    function downloadQRCode() {
      const qrDiv = document.getElementById('qrcode');
      let dataUrl = null;
      
      const img = qrDiv.querySelector('img');
      const canvas = qrDiv.querySelector('canvas') || document.getElementById('qrCanvas');
      
      if (img && img.src && img.src.startsWith('data:')) {
        dataUrl = img.src;
      } else if (canvas && canvas.toDataURL) {
        dataUrl = canvas.toDataURL('image/png');
      }

      if (!dataUrl) {
        alert(currentLang === 'vi' ? 'Chưa có ảnh mã QR để tải!' : 'No QR image available to download!');
        return;
      }

      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `ticket-${ticketId}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function resetTicketStatus() {
      try {
        const res = await fetch(`/api/tickets/${ticketId}/reset`, { method: "POST" });
        if (res.ok) {
          forceRotateQR();
        } else {
          alert("Không thể đặt lại vé!");
        }
      } catch (err) {
        console.error("Lỗi đặt lại vé:", err);
      }
    }

    function checkPageAuth() {
      const user = JSON.parse(localStorage.getItem('securepass_user') || 'null');
      if (!user || !user.role) {
        window.location.replace('/login');
        return false;
      }
      if (user.role === 'guard') {
        window.location.replace('/gatekeeper');
        return false;
      }
      // If role is guest, hide guard and admin tabs!
      if (user.role === 'guest') {
        const tabGuard = document.getElementById('tabGuard');
        const tabAdmin = document.getElementById('tabAdmin');
        if (tabGuard) tabGuard.style.display = 'none';
        if (tabAdmin) tabAdmin.style.display = 'none';
      }
      return true;
    }

    function logout() {
      localStorage.removeItem('securepass_user');
      sessionStorage.clear();
      window.location.href = '/login';
    }

    window.onload = function() {
      if (!checkPageAuth()) return;
      applyI18n();
      startCountdown();
    };
  </script>
</body>
</html>
